apiVersion: apps/v1
kind: Deployment
metadata:
  name: compose-app-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: compose-app
  template:
    metadata:
      labels:
        app: compose-app
    spec:
      containers:
      - name: compose-app
        image: compose-practice-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: app-config